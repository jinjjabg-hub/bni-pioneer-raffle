<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행운 추첨 — 팀 게임 (BNI 퀴즈 · 딱 10초)</title>
<style>
/* 팀한판 공통 스타일 — 밝은 종이 바탕 + 남색 잉크 + 빨강 포인트 */
:root {
  --paper: #fff8ec; --card: #ffffff; --ink: #1b2440; --soft: #5b6480; --line: #e6dcc8;
  --red: #cf2030; --mint: #17a589; --gold: #f2a900;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  background: var(--paper); color: var(--ink); line-height: 1.5; word-break: keep-all;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
.btn {
  display: inline-block; padding: 12px 20px; border-radius: 14px; font-weight: 800; font-size: 17px;
  background: var(--ink); color: #fff; text-decoration: none; text-align: center;
  box-shadow: 0 4px 0 rgba(27, 36, 64, .25); transition: transform .08s;
}
.btn:active { transform: translateY(2px); }
.btn.red { background: var(--red); }
.btn.line { background: var(--card); color: var(--ink); border: 2px solid var(--ink); box-shadow: none; }
.btn.small { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.card { background: var(--card); border: 2px solid var(--ink); border-radius: 20px; padding: 22px; }
.muted { color: var(--soft); }
.brand { font-weight: 900; letter-spacing: -.04em; }
.brand b { color: var(--red); }
h1, h2, h3 { letter-spacing: -.03em; line-height: 1.25; }

dialog { border: 2px solid var(--ink); border-radius: 20px; padding: 24px; margin: auto; width: min(640px, 92vw); color: var(--ink); background: var(--card); }
dialog::backdrop { background: rgba(27, 36, 64, .55); }
dialog h3 { font-size: 22px; margin-bottom: 6px; }
dialog textarea { width: 100%; min-height: 240px; margin: 12px 0; padding: 12px; font: inherit; font-size: 15px; border: 2px solid var(--line); border-radius: 12px; resize: vertical; }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; }

/* 팀 색 (12색 순환) */
.c0 { --tc: #cf2030; } .c1 { --tc: #1f6feb; } .c2 { --tc: #17a589; } .c3 { --tc: #f2a900; }
.c4 { --tc: #8e44ad; } .c5 { --tc: #e67e22; } .c6 { --tc: #0e9aa7; } .c7 { --tc: #d63384; }
.c8 { --tc: #5d7a1f; } .c9 { --tc: #6f42c1; } .c10 { --tc: #b5651d; } .c11 { --tc: #475569; }

/* 팀 게임 화면 */
  body { overflow: hidden; }
  #app { height: 100vh; display: flex; flex-direction: column; padding: 2.2vh 2.4vw; gap: 2vh; }
  header { display: flex; align-items: center; gap: 12px; }
  header .brand { font-size: 3.4vh; text-decoration: none; color: inherit; }
  header .sp { flex: 1; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { padding: 8px 16px; border-radius: 999px; border: 2px solid var(--ink); font-weight: 800; background: var(--card); }
  .tabs button.on { background: var(--ink); color: #fff; }
  .hint { font-size: 1.8vh; color: var(--soft); font-weight: 700; }
  kbd { background: var(--ink); color: #fff; border-radius: 6px; padding: 1px 8px; font: inherit; }
  #body { flex: 1; min-height: 0; display: flex; gap: 2vw; }
  #stage { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2vh; }
  .board { width: 25vw; overflow: auto; }
  .board h3 { font-size: 2.4vh; margin-bottom: 1vh; }
  .trow { display: flex; align-items: center; gap: 6px; padding: 1vh .4vw; border-bottom: 1px solid var(--line); font-size: 2.3vh; font-weight: 800; border-radius: 8px; }
  .trow.pick { background: #ffe9a8; }
  .trow .dot { width: 1.6vh; height: 1.6vh; border-radius: 50%; background: var(--tc); flex: none; }
  .trow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .trow .adj { font-size: 1.6vh; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  .trow .sc { min-width: 3vw; text-align: right; }
  .title { font-size: 4.4vh; font-weight: 900; }
  .q { font-size: 5vh; font-weight: 900; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6vh; flex: 1; }
  .ch { border: 2px solid var(--ink); border-radius: 18px; background: var(--card); font-size: 3.8vh; font-weight: 800; display: flex; align-items: center; padding: 0 2vw; gap: 1vw; }
  .ch i { font-style: normal; background: var(--ink); color: #fff; border-radius: 10px; width: 5.4vh; height: 5.4vh; display: grid; place-items: center; flex: none; }
  .ch.ok { background: #c9f2e3; border-color: var(--mint); }
  .ch.no { opacity: .35; }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.5vh; }
  .big { font-size: 26vh; font-weight: 900; color: var(--red); line-height: 1; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { padding: 6px 14px; border-radius: 999px; background: var(--tc); color: #fff; font-weight: 800; font-size: 2vh; }
  .result { flex: 1; display: flex; flex-direction: column; gap: 1vh; justify-content: center; }
  .rrow { display: flex; align-items: center; gap: 1.4vw; background: var(--card); border: 2px solid var(--ink); border-left: 1.2vw solid var(--tc); border-radius: 16px; padding: 1.2vh 1.6vw; font-size: min(3.6vh, calc(34vh / var(--n))); font-weight: 900; }
  .rrow .rk { width: 5vw; } .rrow .nm { flex: 1; } .rrow .pt { color: var(--red); }
  .rrow.hid { visibility: hidden; }
  .rrow.win { background: #ffe9a8; transform: scale(1.03); }
  #fx { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="btn line small" href="./" title="추첨 화면으로 돌아가기">← 추첨</a>
    <span class="brand">팀 <b>게임</b></span>
    <div class="tabs" id="tabs">
      <button data-tab="quiz">💡 BNI 퀴즈</button><button data-tab="stop">⏱️ 딱 10초</button><button data-tab="final">🏆 최종 발표</button>
    </div>
    <span class="hint" id="hint"></span>
    <span class="sp"></span>
    <button class="btn line small" id="bTeams">👥 팀 설정</button>
    <button class="btn line small" id="bQuiz">✏️ 퀴즈 편집</button>
    <button class="btn line small" id="bReset">↺ 점수 초기화</button>
  </header>
  <div id="body">
    <section id="stage"></section>
    <aside class="card board"><h3>점수판</h3><div id="board"></div></aside>
  </div>
</div>
<canvas id="fx"></canvas>

<dialog id="dlgTeams">
  <h3>팀 설정</h3>
  <p class="muted">한 줄에 팀 이름 하나씩 (최대 20팀). 기존 점수는 줄 순서대로 유지돼요.</p>
  <textarea id="taTeams"></textarea>
  <div class="row"><button class="btn line small" data-close>취소</button><button class="btn small" id="saveTeams">저장</button></div>
</dialog>
<dialog id="dlgQuiz">
  <h3>퀴즈 문제 편집</h3>
  <p class="muted">한 줄에 한 문제: <b>질문 | 보기1 | 보기2 | 보기3 | 보기4 | 정답번호</b></p>
  <textarea id="taQuiz"></textarea>
  <div class="row"><button class="btn line small" data-close>취소</button><button class="btn small" id="saveQuiz">저장</button></div>
</dialog>

<script>
// 팀 게임(BNI 퀴즈 · 딱 10초 · 최종 발표): game 저장소(팀한판)의 한 화면 게임을 옮겨 온 것.
// 서버 없이 이 브라우저 안에서만 돌아간다. 점수·문제는 이 브라우저에 저장.
const $ = (id) => document.getElementById(id);
const stage = $("stage");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DEFAULT_QUIZ = [
  { q: "BNI의 핵심 철학 'Givers Gain'의 뜻은?", c: ["주는 자가 얻는다", "먼저 받는 자가 이긴다", "빠른 자가 얻는다", "많이 아는 자가 얻는다"], a: 0 },
  { q: "BNI를 창립한 사람은?", c: ["아이번 마이즈너", "데일 카네기", "스티븐 코비", "피터 드러커"], a: 0 },
  { q: "멤버끼리 1:1로 만나 서로의 사업을 깊이 알아가는 활동은?", c: ["원투원", "피처 프레젠테이션", "비지터 데이", "위클리 프레젠테이션"], a: 0 },
  { q: "BNI가 처음 시작된 해는?", c: ["1975년", "1985년", "1995년", "2005년"], a: 1 },
  { q: "한 챕터에서 같은 전문분야 멤버는 몇 명까지 가능할까요?", c: ["1명", "2명", "3명", "제한 없음"], a: 0 },
  { q: "VCP 프로세스의 올바른 순서는?", c: ["수익 → 신뢰 → 인지", "신뢰 → 인지 → 수익", "인지 → 신뢰 → 수익", "인지 → 수익 → 신뢰"], a: 2 },
  { q: "초성 퀴즈! 'ㄹㅍㄹ' — 멤버에게 고객을 소개해 주는 것은?", c: ["리퍼럴", "리플릿", "리필", "라펠"], a: 0 },
  { q: "초성 퀴즈! 'ㅂㅈㅌ' — 챕터 모임에 처음 방문한 손님은?", c: ["비지터", "바리스타", "부자터", "배지터"], a: 0 },
];

const SAVE = "raffle_team_games"; // 팀한판 사이트와 주소(github.io)가 같아서, 점수가 섞이지 않게 이름을 달리한다
let S = JSON.parse(localStorage.getItem(SAVE) || "null") || {
  teams: ["1팀", "2팀", "3팀", "4팀"].map((name) => ({ name, total: 0 })), quiz: DEFAULT_QUIZ,
};
const save = () => localStorage.setItem(SAVE, JSON.stringify(S));
const col = (i) => "c" + (i % 12);

let tab = "quiz";
let quiz = null;                                   // { qs, qi, reveal, given:Set }
let stop = { pick: 0, t0: 0, running: false, times: {}, applied: false };
let revealed = 0;

/* ───────── 점수판 ───────── */
function board() {
  $("board").innerHTML = S.teams.map((t, i) => `
    <div class="trow ${col(i)} ${tab === "stop" && stop.pick === i ? "pick" : ""}"><span class="dot"></span>
      <span class="nm" data-team="${i}">${esc(t.name)}</span>
      <button class="adj" data-adj="${i}" data-d="-10">−10</button><button class="adj" data-adj="${i}" data-d="10">+10</button>
      <span class="sc">${t.total}</span></div>`).join("");
}

/* ───────── 퀴즈: 정답 공개 뒤 맞힌 팀을 점수판에서 눌러 +10 ───────── */
function shuffle(q) { // 정답 위치를 외우지 못하게 보기 순서를 섞는다
  const idx = q.c.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return { q: q.q, c: idx.map((i) => q.c[i]), a: idx.indexOf(q.a) };
}
function viewQuiz() {
  if (!quiz) return `<div class="center"><div class="title">💡 BNI 퀴즈 · ${S.quiz.length}문제</div>
    <p class="muted" style="font-size:2.6vh;font-weight:700">문제를 보고 먼저 손 든 팀이 답해요.<br>정답 공개 뒤, 맞힌 팀 이름을 오른쪽 점수판에서 누르면 +10점</p>
    <button class="btn red" id="qStart">시작 (Space)</button></div>`;
  if (quiz.qi >= quiz.qs.length) return `<div class="center"><div class="title">퀴즈 끝! 🎉</div><button class="btn" id="qStart">처음부터 다시</button></div>`;
  const q = quiz.qs[quiz.qi];
  return `<div class="title">💡 ${quiz.qi + 1} / ${quiz.qs.length}</div><div class="q">${esc(q.q)}</div>
    <div class="choices">${q.c.map((c, i) => `<div class="ch ${quiz.reveal ? (i === q.a ? "ok" : "no") : ""}"><i>${i + 1}</i>${esc(c)}</div>`).join("")}</div>`;
}

/* ───────── 딱 10초: 팀 대표가 한 명씩 나와 스페이스바로 멈춘다 ───────── */
function viewStop() {
  const t = S.teams[stop.pick], mine = stop.times[stop.pick];
  const done = Object.keys(stop.times).length;
  const chips = S.teams.map((x, i) => stop.times[i] != null ? `<span class="chip ${col(i)}">${esc(x.name)} ${(stop.times[i] / 1000).toFixed(2)}초</span>` : "").join("");
  return `<div class="center">
    <div class="title">⏱️ 딱 10초 — <span style="color:var(--red)">${esc(t ? t.name : "")}</span> 차례</div>
    <div class="big" id="sw">${mine != null ? (mine / 1000).toFixed(2) : "0.0"}</div>
    <p class="muted" style="font-size:2.4vh;font-weight:700">${mine != null ? `오차 ${(Math.abs(mine - 10000) / 1000).toFixed(2)}초` : "3초 뒤부터 숫자가 가려져요. 감으로 10초에 멈추세요!"}</p>
    <div class="chips">${chips}</div>
    ${done >= 2 && !stop.running ? `<button class="btn red" id="sApply" ${stop.applied ? "disabled" : ""}>${stop.applied ? "점수 반영 완료" : "순위대로 점수 반영"}</button>` : ""}
    ${done ? `<button class="btn line small" id="sClear">기록 지우고 새로 하기</button>` : ""}
  </div>`;
}
function stopKey() {
  if (stop.running) { // 멈춤
    stop.running = false; stop.times[stop.pick] = performance.now() - stop.t0;
    render();
  } else if (stop.times[stop.pick] != null) { // 다음 팀으로
    const next = S.teams.findIndex((_, i) => stop.times[i] == null);
    if (next >= 0) { stop.pick = next; render(); }
  } else { stop.running = true; stop.applied = false; stop.t0 = performance.now(); render(); }
}
function stopApply() { // 10초에 가까운 순서대로 순위 점수
  const rows = Object.entries(stop.times).map(([i, v]) => ({ i: +i, err: Math.abs(v - 10000) })).sort((a, b) => a.err - b.err);
  rows.forEach((r, k) => (S.teams[r.i].total += (S.teams.length - k) * 10));
  stop.applied = true; save(); render();
}
setInterval(() => {
  if (tab !== "stop" || !stop.running || !$("sw")) return;
  const t = (performance.now() - stop.t0) / 1000;
  $("sw").textContent = t < 3 ? t.toFixed(1) : "?.?";
}, 50);

/* ───────── 최종 발표: 꼴찌부터 한 팀씩 ───────── */
function viewFinal() {
  const rows = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.total - a.total);
  let rank = 0;
  rows.forEach((t, k) => { rank = k > 0 && rows[k - 1].total === t.total ? rank : k + 1; t.rank = rank; });
  return `<div class="result" style="--n:${Math.max(4, rows.length)}"><div class="title" style="text-align:center">🏆 최종 순위 발표</div>
    ${rows.map((t) => `<div class="rrow hid ${col(t.i)}"><span class="rk">${t.rank}위</span><span class="nm">${esc(t.name)}</span><span class="pt">${t.total}점</span></div>`).join("")}</div>`;
}
function revealNext() {
  const rows = [...stage.querySelectorAll(".rrow")];
  if (revealed >= rows.length) return;
  const el = rows[rows.length - 1 - revealed];
  el.classList.remove("hid"); revealed++;
  if (revealed === rows.length) { el.classList.add("win"); confetti(); }
}

/* ───────── 공통 ───────── */
function render() {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  stage.innerHTML = ({ quiz: viewQuiz, stop: viewStop, final: viewFinal })[tab]();
  if (tab === "final") revealed = 0;
  $("hint").innerHTML = ({
    quiz: "<kbd>Space</kbd> 정답 공개 / 다음 문제 · 맞힌 팀 이름 클릭 = +10",
    stop: "팀 이름 클릭 = 차례 선택 · <kbd>Space</kbd> 시작 / 멈춤 / 다음 팀",
    final: "<kbd>Space</kbd> 한 팀씩 공개",
  })[tab];
  board();
}

function space() {
  if (tab === "final") return revealNext();
  if (tab === "stop") return stopKey();
  if (!quiz || quiz.qi >= quiz.qs.length) quiz = { qs: S.quiz.map(shuffle), qi: 0, reveal: false };
  else if (!quiz.reveal) quiz.reveal = true;
  else { quiz.qi++; quiz.reveal = false; }
  render();
}

document.addEventListener("keydown", (e) => {
  if (document.querySelector("dialog[open]")) return;
  if (e.code === "Space" || e.key === "Enter" || e.key === "PageDown") { e.preventDefault(); space(); }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button, .nm");
  if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; render(); }
  else if (b.dataset.adj) { S.teams[+b.dataset.adj].total += +b.dataset.d; save(); board(); }
  else if (b.dataset.team) {
    const i = +b.dataset.team;
    if (tab === "stop" && !stop.running) { stop.pick = i; render(); }
    else if (tab === "quiz" && quiz && quiz.reveal) { S.teams[i].total += 10; save(); board(); }
  }
  else if (b.id === "qStart") { quiz = null; space(); }
  else if (b.id === "sApply") stopApply();
  else if (b.id === "sClear") { stop = { pick: 0, t0: 0, running: false, times: {}, applied: false }; render(); }
  else if (b.id === "bReset") { if (confirm("모든 팀 점수를 0으로 되돌릴까요?")) { S.teams.forEach((t) => (t.total = 0)); save(); render(); } }
  else if (b.id === "bTeams") { $("taTeams").value = S.teams.map((t) => t.name).join("\n"); $("dlgTeams").showModal(); }
  else if (b.id === "bQuiz") { $("taQuiz").value = S.quiz.map((q) => [q.q, ...q.c, q.a + 1].join(" | ")).join("\n"); $("dlgQuiz").showModal(); }
  if (b.blur) b.blur(); // 버튼에 포커스가 남으면 스페이스바가 버튼을 다시 눌러 버린다
});
document.querySelectorAll("[data-close]").forEach((b) => (b.onclick = () => b.closest("dialog").close()));
$("saveTeams").onclick = () => {
  const names = $("taTeams").value.split("\n").map((s) => s.trim()).filter(Boolean).slice(0, 20);
  if (names.length) {
    S.teams = names.map((name, i) => ({ name, total: S.teams[i] ? S.teams[i].total : 0 }));
    stop = { pick: 0, t0: 0, running: false, times: {}, applied: false };
    save(); render();
  }
  $("dlgTeams").close();
};
$("saveQuiz").onclick = () => {
  const qs = [], bad = [];
  $("taQuiz").value.split("\n").forEach((line, i) => {
    if (!line.trim()) return;
    const p = line.split("|").map((s) => s.trim());
    const a = parseInt(p[p.length - 1], 10) - 1, c = p.slice(1, -1);
    if (p.length < 4 || !(a >= 0 && a < c.length)) bad.push(i + 1); else qs.push({ q: p[0], c, a });
  });
  if (bad.length) return alert(`${bad.join(", ")}번째 줄 형식을 확인해 주세요.\n예) 질문 | 보기1 | 보기2 | 보기3 | 보기4 | 2`);
  S.quiz = qs; quiz = null; save(); render();
  $("dlgQuiz").close();
};

function confetti() {
  const cv = $("fx"), g = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#cf2030", "#1f6feb", "#17a589", "#f2a900", "#8e44ad"];
  const ps = Array.from({ length: 220 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5, vx: (Math.random() - 0.5) * 4, vy: 2 + Math.random() * 5,
    s: 6 + Math.random() * 8, c: cols[(Math.random() * cols.length) | 0], r: Math.random() * 6,
  }));
  const t0 = performance.now();
  (function tick(t) {
    g.clearRect(0, 0, cv.width, cv.height);
    if (t - t0 > 6000) return;
    for (const p of ps) {
      p.x += p.vx; p.y += p.vy; p.r += 0.1;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore();
    }
    requestAnimationFrame(tick);
  })(t0);
}
render();
</script>
</body>
